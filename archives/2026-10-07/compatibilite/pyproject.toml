[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
# The lexical preprocessing source is fingerprinted by the published dataset.
extend-exclude = [
    "src/preprocessing.py", "dataset", "models", "results", "output",
    "docs/memoire", ".tmp-tests", ".venv-comparison", ".cache-comparison",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src", "webapp"]

[tool.ruff.format]
line-ending = "lf"
